<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>eisenpaper</title>
<style>
  :root {
    --paper: #f6f1e3;
    --ink: #2b2a26;
    --pencil: #8a8578;
    --faint: #b9b29e;
    --accent: #b03a2e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.5), transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 27px, rgba(138,133,120,.055) 27px 28px),
      var(--paper);
    color: var(--ink);
    font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Neue", "Comic Sans MS", cursive;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }

  #pane { position: fixed; inset: 0; cursor: crosshair; }

  /* axes */
  .axis { position: absolute; background: var(--pencil); opacity: .5; pointer-events: none; }
  #axis-x { left: 3%; right: 3%; top: 50%; height: 1.5px;
            box-shadow: 0 .5px 0 rgba(138,133,120,.3); }
  #axis-y { top: 4%; bottom: 4%; left: 50%; width: 1.5px;
            box-shadow: .5px 0 0 rgba(138,133,120,.3); }
  .axis-label {
    position: absolute; color: var(--pencil); font-size: 15px;
    pointer-events: none; opacity: .8; letter-spacing: .5px;
  }
  #label-urgent    { right: 3%; top: calc(50% + 8px); }
  #label-important { left: calc(50% + 10px); top: 4%; }

  .qlabel {
    position: absolute; color: var(--faint); pointer-events: none;
    font-size: clamp(18px, 3.2vw, 30px); opacity: .55; font-weight: bold;
  }
  #q-do        { right: 5%;  top: 6%; }
  #q-schedule  { left: 5%;   top: 6%; }
  #q-delegate  { right: 5%;  bottom: 6%; }
  #q-drop      { left: 5%;   bottom: 6%; }

  /* tasks */
  .note {
    position: absolute; transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
    max-width: 34ch; padding: 2px 8px;
    font-size: 19px; line-height: 1.25;
    cursor: grab; white-space: pre-wrap; overflow-wrap: break-word;
    border-radius: 3px;
    transition: background .12s;
  }
  .note:hover { background: rgba(255, 249, 196, .55); }
  .note.dragging { cursor: grabbing; opacity: .85; z-index: 10;
                   background: rgba(255, 249, 196, .75);
                   box-shadow: 2px 3px 8px rgba(43,42,38,.18); }
  .note.done { color: var(--pencil); }
  .note.done .txt {
    background: linear-gradient(to top, transparent 44%, var(--accent) 44%, var(--accent) 52%, transparent 52%);
    opacity: .75;
  }
  .note.editing { cursor: text; background: rgba(255, 249, 196, .8);
                  outline: 1.5px dashed var(--pencil); min-width: 6ch; }
  .note .txt { outline: none; }

  /* toolbar */
  #bar {
    position: fixed; top: 10px; right: 12px; z-index: 20;
    display: flex; gap: 6px; opacity: .45; transition: opacity .15s;
  }
  #bar:hover { opacity: 1; }
  #bar button {
    font: inherit; font-size: 14px; color: var(--ink);
    background: rgba(255,255,255,.6); border: 1px solid var(--faint);
    border-radius: 4px; padding: 3px 10px; cursor: pointer;
  }
  #bar button:hover { background: #fff; }

  #hint {
    position: fixed; left: 50%; top: 30%; transform: translateX(-50%) rotate(-1.5deg);
    color: var(--pencil); font-size: 21px; opacity: .75; pointer-events: none;
    text-align: center;
  }

  /* archive panel */
  #archive {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 90vw);
    background: #efe9d8; border-left: 2px solid var(--faint);
    box-shadow: -4px 0 18px rgba(43,42,38,.15);
    transform: translateX(105%); transition: transform .2s ease;
    z-index: 30; padding: 18px; overflow-y: auto;
  }
  #archive.open { transform: none; }
  #archive h2 { margin: 0 0 4px; font-size: 22px; }
  #archive .sheet { margin: 14px 0; border-top: 1px dashed var(--faint); padding-top: 8px; }
  #archive .sheet-date { color: var(--pencil); font-size: 14px; }
  #archive .sheet div.t { font-size: 17px; }
  #archive .t.was-done { text-decoration: line-through; color: var(--pencil); }
  #archive .close { float: right; }

  #file { display: none; }
  @media (max-width: 700px) {
    .note { font-size: 17px; max-width: 26ch; }
  }
</style>
</head>
<body>

<div id="pane">
  <div class="axis" id="axis-x"></div>
  <div class="axis" id="axis-y"></div>
  <span class="axis-label" id="label-urgent">urgent &rarr;</span>
  <span class="axis-label" id="label-important">&uarr; important</span>
  <span class="qlabel" id="q-do">do</span>
  <span class="qlabel" id="q-schedule">schedule</span>
  <span class="qlabel" id="q-delegate">delegate</span>
  <span class="qlabel" id="q-drop">drop</span>
  <div id="hint">double-click anywhere to jot a task<br>
    <small>click = cross out &middot; double-click = edit &middot; drag = reprioritize &middot; right-click = tear off</small>
  </div>
</div>

<div id="bar">
  <button id="btn-fresh" title="archive crossed-out tasks, keep the rest">fresh sheet</button>
  <button id="btn-archive">old sheets</button>
  <button id="btn-export">export</button>
  <button id="btn-import">import</button>
</div>

<div id="archive">
  <button class="close" onclick="document.getElementById('archive').classList.remove('open')">close</button>
  <h2>old sheets</h2>
  <div id="archive-list"></div>
</div>

<input type="file" id="file" accept="application/json">

<script>
"use strict";
const LS_KEY = "eisenpaper.v1";
const pane = document.getElementById("pane");
const hint = document.getElementById("hint");

let state = load();

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (Array.isArray(s.tasks) && Array.isArray(s.archive)) return s;
    }
  } catch (e) { console.warn("load failed", e); }
  return { tasks: [], archive: [] };
}
function save() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
// stable pseudo-random rotation per task, like a scrap laid on the desk
function rot(id) {
  let h = 0;
  for (const c of id) h = (h * 31 + c.charCodeAt(0)) | 0;
  return ((h % 100) / 100 * 3.6 - 1.8).toFixed(2) + "deg";
}

/* ---------- rendering ---------- */
function render() {
  pane.querySelectorAll(".note").forEach(n => n.remove());
  for (const t of state.tasks) pane.appendChild(noteEl(t));
  hint.style.display = state.tasks.length ? "none" : "";
}

function noteEl(t) {
  const el = document.createElement("div");
  el.className = "note" + (t.done ? " done" : "");
  el.dataset.id = t.id;
  el.style.left = (t.x * 100) + "%";
  el.style.top = (t.y * 100) + "%";
  el.style.setProperty("--rot", rot(t.id));
  const txt = document.createElement("span");
  txt.className = "txt";
  txt.textContent = t.text;
  el.appendChild(txt);
  return el;
}

/* ---------- create / edit ---------- */
let editing = null; // {el, task, isNew}

function startEdit(task, el, isNew) {
  if (editing) commitEdit();
  editing = { el, task, isNew };
  el.classList.add("editing");
  const txt = el.querySelector(".txt");
  txt.contentEditable = "plaintext-only" in document.body ? "plaintext-only" : "true";
  txt.focus();
  // caret to end
  const r = document.createRange();
  r.selectNodeContents(txt); r.collapse(false);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
}

function commitEdit() {
  if (!editing) return;
  const { el, task, isNew } = editing;
  editing = null;
  const text = el.querySelector(".txt").innerText.trim();
  el.classList.remove("editing");
  el.querySelector(".txt").contentEditable = "false";
  if (!text) {                    // empty → discard
    state.tasks = state.tasks.filter(t => t.id !== task.id);
  } else {
    task.text = text;
    if (isNew) state.tasks.push(task);
  }
  save(); render();
}

function cancelEdit() {
  if (!editing) return;
  const { task, isNew } = editing;
  editing = null;
  if (isNew) state.tasks = state.tasks.filter(t => t.id !== task.id);
  save(); render();
}

pane.addEventListener("dblclick", e => {
  const noteHit = e.target.closest(".note");
  if (noteHit) {                                   // edit existing
    clearTimeout(clickTimer); clickTimer = null;
    const task = state.tasks.find(t => t.id === noteHit.dataset.id);
    if (task && task.undoneByDbl) { delete task.undoneByDbl; }
    startEdit(task, noteHit, false);
    return;
  }
  if (editing) { commitEdit(); return; }           // click-away commits first
  const task = {
    id: uid(),
    text: "",
    x: e.clientX / innerWidth,
    y: e.clientY / innerHeight,
    done: false,
    created: Date.now()
  };
  const el = noteEl(task);
  pane.appendChild(el);
  hint.style.display = "none";
  startEdit(task, el, true);
});

document.addEventListener("keydown", e => {
  if (!editing) return;
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); commitEdit(); }
  if (e.key === "Escape") { e.preventDefault(); cancelEdit(); }
});

/* ---------- drag / click(=cross out) / right-click(=delete) ---------- */
let drag = null;      // {el, task, startX, startY, moved}
let clickTimer = null;

pane.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  const el = e.target.closest(".note");
  if (!el || el.classList.contains("editing")) return;
  if (editing) commitEdit();
  const task = state.tasks.find(t => t.id === el.dataset.id);
  if (!task) return;
  drag = { el, task, startX: e.clientX, startY: e.clientY, moved: false };
  el.setPointerCapture(e.pointerId);
});

pane.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
  if (!drag.moved && Math.hypot(dx, dy) < 6) return;   // click-jitter threshold
  drag.moved = true;
  drag.el.classList.add("dragging");
  drag.task.x = Math.min(.98, Math.max(.02, e.clientX / innerWidth));
  drag.task.y = Math.min(.97, Math.max(.03, e.clientY / innerHeight));
  drag.el.style.left = (drag.task.x * 100) + "%";
  drag.el.style.top = (drag.task.y * 100) + "%";
});

pane.addEventListener("pointerup", e => {
  if (!drag) return;
  const { el, task, moved } = drag;
  drag = null;
  el.classList.remove("dragging");
  if (moved) { save(); return; }
  // plain click → cross out / un-cross, delayed so dblclick(edit) can cancel it
  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => {
    clickTimer = null;
    task.done = !task.done;
    task.doneAt = task.done ? Date.now() : undefined;
    save(); render();
  }, 260);
});

pane.addEventListener("contextmenu", e => {
  const el = e.target.closest(".note");
  if (!el) return;
  e.preventDefault();
  const task = state.tasks.find(t => t.id === el.dataset.id);
  if (task && confirm(`tear off "${task.text}"?`)) {
    state.tasks = state.tasks.filter(t => t.id !== task.id);
    save(); render();
  }
});

/* ---------- fresh sheet / archive ---------- */
document.getElementById("btn-fresh").addEventListener("click", () => {
  const done = state.tasks.filter(t => t.done);
  if (!done.length) { alert("nothing crossed out yet — cross tasks out first, then start a fresh sheet."); return; }
  if (!confirm(`start a fresh sheet? ${done.length} crossed-out task(s) go to the old sheets, ${state.tasks.length - done.length} stay.`)) return;
  state.archive.push({ at: Date.now(), tasks: done });
  state.tasks = state.tasks.filter(t => !t.done);
  save(); render();
});

document.getElementById("btn-archive").addEventListener("click", () => {
  const list = document.getElementById("archive-list");
  list.innerHTML = "";
  if (!state.archive.length) list.textContent = "no old sheets yet.";
  for (const sheet of [...state.archive].reverse()) {
    const s = document.createElement("div"); s.className = "sheet";
    const d = document.createElement("div"); d.className = "sheet-date";
    d.textContent = new Date(sheet.at).toLocaleString();
    s.appendChild(d);
    for (const t of sheet.tasks) {
      const row = document.createElement("div");
      row.className = "t" + (t.done ? " was-done" : "");
      row.textContent = t.text;
      s.appendChild(row);
    }
    list.appendChild(s);
  }
  document.getElementById("archive").classList.add("open");
});

/* ---------- export / import ---------- */
document.getElementById("btn-export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "eisenpaper-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
});

const fileInput = document.getElementById("file");
document.getElementById("btn-import").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", async () => {
  const f = fileInput.files[0];
  if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!Array.isArray(s.tasks) || !Array.isArray(s.archive)) throw new Error("not an eisenpaper file");
    if (!confirm(`import ${s.tasks.length} task(s) and ${s.archive.length} old sheet(s)? this replaces the current sheet.`)) return;
    state = s; save(); render();
  } catch (err) { alert("import failed: " + err.message); }
  fileInput.value = "";
});

render();
</script>
</body>
</html>
